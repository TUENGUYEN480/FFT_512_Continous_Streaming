# GitHub Actions Workflow for FFT Simulation
# This workflow will be triggered on push and pull requests

name: FFT Simulation CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    name: Lint SystemVerilog Code
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Verible
      run: |
        wget https://github.com/chipsalliance/verible/releases/download/v0.0-3428-gcfcbb82b/verible-v0.0-3428-gcfcbb82b-Ubuntu-22.04-jammy-x86_64.tar.gz
        tar -xzf verible-v0.0-3428-gcfcbb82b-Ubuntu-22.04-jammy-x86_64.tar.gz
        echo "$PWD/verible-v0.0-3428-gcfcbb82b/bin" >> $GITHUB_PATH
    
    - name: Run Verible Linter
      run: |
        find 00_src -name "*.sv" -exec verible-verilog-lint {} \;
      continue-on-error: true

  python-check:
    name: Check Python Scripts
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib scipy pylint flake8
    
    - name: Lint Python code
      run: |
        flake8 02_sim/*.py --max-line-length=120
      continue-on-error: true
    
    - name: Check Python syntax
      run: |
        python -m py_compile 02_sim/*.py

  documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check README exists
      run: |
        test -f README.md || exit 1
        test -f CONTRIBUTING.md || exit 1
        test -f LICENSE || exit 1
    
    - name: Check for broken links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
      continue-on-error: true

  # Note: Full simulation requires commercial tools (Xcelium)
